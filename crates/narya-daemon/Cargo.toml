[package]
name = "narya-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
narya-ipc = { path = "../narya-ipc" }
narya-core = { path = "../narya-core" }
narya-kernel = { path = "../narya-kernel" }
narya-platform = { path = "../narya-platform" }
narya-rules = { path = "../narya-rules" }
reqwest = { version = "0.11", features = ["rustls-tls"] }
sha2 = "0.10"
ed25519-dalek = "2"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
